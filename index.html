<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco de pruebas del taller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1a2b">
<style>
  :root{ --fondo:#0e1a2b; --panel:#16263c; --linea:#2a3f5c; --texto:#eef3f8; --tenue:#9db2c8;
         --verde:#2e9e5b; --rojo:#d64545; --gris:#8a97a5; --ambar:#c9a227; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif; background:var(--fondo); color:var(--texto); }
  header{ padding:20px 16px 12px; border-bottom:1px solid var(--linea); position:sticky; top:0; background:var(--fondo); z-index:5; }
  header h1{ font-size:20px; font-weight:700; letter-spacing:.2px; }
  header p{ color:var(--tenue); font-size:13px; margin-top:4px; }
  .barra{ display:flex; gap:8px; align-items:center; margin-top:12px; }
  .barra button{ background:var(--panel); color:var(--texto); border:1px solid var(--linea); border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .barra span{ color:var(--tenue); font-size:12px; }
  main{ padding:14px 12px 40px; max-width:760px; margin:0 auto; }
  .tarjeta{ background:var(--panel); border:1px solid var(--linea); border-radius:14px; padding:14px; margin-bottom:14px; }
  .fila{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .proyecto{ font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--ambar); }
  .fecha{ font-size:12px; color:var(--tenue); white-space:nowrap; }
  .prueba{ font-size:17px; font-weight:650; margin-top:5px; line-height:1.3; }
  .dispositivo{ font-size:13px; color:var(--tenue); margin-top:3px; }
  .detalle{ font-size:14px; line-height:1.5; margin-top:9px; color:#d7e2ee; }
  .sello{ display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; margin-top:10px; }
  .sello.pasa{ background:rgba(46,158,91,.18); color:#5fd68d; border:1px solid var(--verde); }
  .sello.falla{ background:rgba(214,69,69,.15); color:#ff8a8a; border:1px solid var(--rojo); }
  .sello.pendiente{ background:rgba(138,151,165,.15); color:#c3cedb; border:1px solid var(--gris); }
  .captura{ margin-top:12px; }
  .captura img{ width:100%; max-width:340px; border-radius:12px; border:1px solid var(--linea); display:block; }
  .vacio{ text-align:center; color:var(--tenue); padding:44px 20px; font-size:15px; line-height:1.6; }
  footer{ text-align:center; color:var(--tenue); font-size:12px; padding:0 16px 28px; }
</style>
</head>
<body>
<header>
  <h1>🖥️ Banco de pruebas del taller</h1>
  <p>La Mac de Dublín prueba las apps por dentro. Aquí queda cada prueba con su captura y su resultado.</p>
  <div class="barra">
    <button id="btn-actualizar" type="button">↻ Actualizar</button>
    <span id="estado">Cargando…</span>
  </div>
</header>
<main id="lista"></main>
<footer>Banco de pruebas del taller · Las pruebas nuevas aparecen solas aquí.</footer>

<script>
var SUPABASE_URL = "https://aoniwgsuhdiigzniucui.supabase.co";
var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvbml3Z3N1aGRpaWd6bml1Y3VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwODQ3NzUsImV4cCI6MjEwOTY2MDc3NX0.ngjdN1aBjyu837pqslyw3QPBsO8a2mOFiSI_fJTg6Pg";
var APP_VERSION = "2026-11-07.1";

function fechaBonita(iso){
  try{
    var d = new Date(iso);
    return d.toLocaleDateString("es", { weekday:"short", day:"numeric", month:"short" }) + " · " +
           d.toLocaleTimeString("es", { hour:"numeric", minute:"2-digit" });
  }catch(e){ return iso || ""; }
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function sello(resultado){
  var r = (resultado || "pendiente").toLowerCase();
  if (r.indexOf("pasa") === 0) return '<span class="sello pasa">✅ PASA</span>';
  if (r.indexOf("falla") === 0) return '<span class="sello falla">❌ FALLA</span>';
  return '<span class="sello pendiente">⏳ ' + esc(resultado || "pendiente").toUpperCase() + "</span>";
}
function tarjeta(p){
  var img = p.captura_url ? '<div class="captura"><a href="' + esc(p.captura_url) + '" target="_blank" rel="noopener"><img src="' + esc(p.captura_url) + '" alt="Captura de la prueba" loading="lazy"></a></div>' : "";
  return '<article class="tarjeta">' +
    '<div class="fila"><span class="proyecto">' + esc(p.proyecto) + '</span><span class="fecha">' + esc(fechaBonita(p.creada_en)) + "</span></div>" +
    '<div class="prueba">' + esc(p.prueba) + "</div>" +
    (p.dispositivo ? '<div class="dispositivo">📱 ' + esc(p.dispositivo) + "</div>" : "") +
    (p.detalle ? '<div class="detalle">' + esc(p.detalle) + "</div>" : "") +
    sello(p.resultado) + img + "</article>";
}
function cargar(){
  var estado = document.getElementById("estado");
  estado.textContent = "Cargando…";
  fetch(SUPABASE_URL + "/rest/v1/pruebas?select=*&order=creada_en.desc&limit=100", {
    headers: { "apikey": ANON, "Authorization": "Bearer " + ANON }
  }).then(function(r){ return r.json(); }).then(function(filas){
    var lista = document.getElementById("lista");
    if (!filas || !filas.length){
      lista.innerHTML = '<div class="vacio">Todavía no hay pruebas registradas.<br>La primera aparecerá aquí en cuanto el banco corra una.</div>';
    } else {
      lista.innerHTML = filas.map(tarjeta).join("");
    }
    estado.textContent = "Actualizado " + new Date().toLocaleTimeString("es", { hour:"numeric", minute:"2-digit" });
  }).catch(function(){
    estado.textContent = "Sin conexión — toca Actualizar para reintentar.";
  });
}
document.getElementById("btn-actualizar").addEventListener("click", cargar);
cargar();

/* Auto-actualización: si hay una versión nueva publicada, recarga sola. */
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
  fetch("version.json", { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(v){
    if (v && v.version && v.version !== APP_VERSION){
      if (navigator.serviceWorker.controller){
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(reg){ reg.unregister(); });
          location.reload();
        });
      } else { location.reload(); }
    }
  }).catch(function(){});
}
</script>
</body>
</html>
